<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Professional Tennis Stringing Limassol - PRO Manager</title>
<style>
  :root{
    --bg:#0a0a0a;
    --bg2:#121212;
    --bg3:#1a1a1a;
    --accent:#d4ff00;
    --accent-dark:#b8dd00;
    --text:#f5f5f5;
    --textmuted:#a0a0a0;
    --danger:#ff4b4b;
    --ok:#00d26a;
    --border:#2a2a2a;
    --shadow:0 4px 12px rgba(0,0,0,0.5);
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 16px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
  .header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
  .brand-dot{width:10px;height:10px;background:var(--accent);border-radius:50%;box-shadow:0 0 8px var(--accent)}
  .btn{background:var(--accent);color:#0a0a0a;border:none;padding:9px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;transition:all .2s}
  .btn:hover{background:var(--accent-dark)}
  .btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-small{padding:5px 9px;font-size:12px}
  nav{background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:61px;z-index:90;overflow-x:auto}
  .tabs{max-width:1200px;margin:0 auto;display:flex;gap:4px;padding:8px 16px}
  .tab{padding:9px 16px;background:transparent;color:var(--textmuted);border:none;border-bottom:2px solid transparent;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;border-radius:6px 6px 0 0;transition:all .2s}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--bg3)}
  .container{max-width:1200px;margin:0 auto;padding:20px 16px}
  .panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
  h2{font-size:18px;margin-bottom:12px;color:var(--accent)}
  h3{font-size:15px;margin:12px 0 8px;color:var(--text)}
  .grid{display:grid;gap:12px}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:768px){
    .grid-2,.grid-3{grid-template-columns:1fr}
  }
  input,select,textarea{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  label{display:block;font-size:12px;color:var(--textmuted);margin-bottom:4px;font-weight:600}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1 1 160px}
  .list{display:flex;flex-direction:column;gap:8px}
  .item{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .item-info{flex:1}
  .badge{background:var(--accent);color:#0a0a0a;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
  .badge-paid{background:var(--ok);color:#0a0a0a}
  .badge-due{background:var(--danger);color:#fff}
  .gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(max-width:500px){.gallery-grid{grid-template-columns:1fr}}
  .gallery-item{position:relative;background:var(--bg3);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .gallery-item img,.gallery-item video{width:100%;height:180px;object-fit:cover;display:block}
  .gallery-item .del{position:absolute;top:6px;right:6px}
  .job-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px}
  .job-header{display:flex;justify-content:space-between;align-items:start;gap:8px;margin-bottom:8px}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .thumb{width:50px;height:50px;border-radius:6px;overflow:hidden;border:1px solid var(--border);cursor:pointer}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .map-box{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
  .modal.active{display:flex}
  .modal-content{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;max-width:400px;width:100%;box-shadow:var(--shadow)}
  .modal-img{max-width:100%;max-height:80vh;border-radius:8px}
  .hidden{display:none}
  .section{margin-bottom:18px}
  .inline{display:flex;gap:8px;align-items:center}
  .muted{color:var(--textmuted);font-size:12px}
  .tag{display:inline-block;background:var(--bg3);border:1px solid var(--border);padding:4px 8px;border-radius:6px;font-size:12px;margin:2px}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand"><div class="brand-dot"></div>PRO Manager <span class="muted">| Limassol</span></div>
    <div class="row" style="flex:0;justify-content:flex-end">
      <a class="btn" href="https://wa.me/35799331469" target="_blank">BOOK VIA WHATSAPP</a>
      <button class="btn btn-secondary" id="adminBtn">CLIENT MANAGER</button>
    </div>
  </div>
</header>

<nav>
  <div class="tabs">
    <button class="tab active" data-tab="clients">Clients & Jobs</button>
    <button class="tab" data-tab="inventory">Inventory</button>
    <button class="tab" data-tab="prices">Prices (Editable)</button>
    <button class="tab" data-tab="gallery">Gallery</button>
    <button class="tab" data-tab="map">Map</button>
  </div>
</nav>

<div class="container">
  <!-- CLIENTS & JOBS -->
  <section id="tab-clients" class="tabcontent">
    <div class="panel">
      <h2>New Job</h2>
      <div class="grid grid-2">
        <div>
          <label>Client Name</label>
          <input id="pName" placeholder="John Doe">
        </div>
        <div>
          <label>Phone</label>
          <input id="pPhone" placeholder="+357 99 000000">
        </div>
        <div>
          <label>Racket</label>
          <input id="pRacket" placeholder="Babolat Pure Drive 2023">
        </div>
        <div>
          <label>String</label>
          <select id="pString"></select>
        </div>
        <div>
          <label>Tension (kg)</label>
          <input id="pTension" placeholder="24/23">
        </div>
        <div>
          <label>Pattern</label>
          <select id="pPattern">
            <option>Prima</option><option>Due</option><option>Classic</option>
          </select>
        </div>
        <div>
          <label>Date</label>
          <input id="pDate" type="date">
        </div>
        <div>
          <label>Price (€)</label>
          <input id="pPrice" placeholder="25">
        </div>
        <div>
          <label>Paid</label>
          <select id="pPaid"><option>Due</option><option>Paid</option></select>
        </div>
        <div style="grid-column:1/-1">
          <label>Notes</label>
          <textarea id="pNotes" rows="2" placeholder="Notes..."></textarea>
        </div>
        <div style="grid-column:1/-1">
          <label>Photos</label>
          <input id="pPhotos" type="file" multiple accept="image/*,video/*">
        </div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="addJobBtn">Add Job</button>
        <button class="btn btn-secondary" id="clearJobBtn">Clear</button>
      </div>
    </div>
    <div class="panel">
      <h2>Jobs</h2>
      <input id="searchJobs" placeholder="Search jobs...">
      <div id="jobsList" class="list"></div>
      <div id="noJobs" class="muted" style="display:none;padding:10px;">No jobs yet.</div>
    </div>
  </section>

  <!-- INVENTORY -->
  <section id="tab-inventory" class="tabcontent hidden">
    <div class="panel">
      <h2>Strings</h2>
      <div class="row">
        <input id="newString" placeholder="Add string...">
        <button class="btn btn-small" id="addStringBtn">Add</button>
      </div>
      <div id="stringsList" class="list"></div>
    </div>
    <div class="panel">
      <h2>Overgrips</h2>
      <div class="row">
        <input id="newOver" placeholder="Add overgrip...">
        <button class="btn btn-small" id="addOverBtn">Add</button>
      </div>
      <div id="overList" class="list"></div>
    </div>
  </section>

  <!-- PRICES -->
  <section id="tab-prices" class="tabcontent hidden">
    <div class="panel">
      <h2>Prices (Editable)</h2>
      <div class="grid grid-3" id="pricesGrid">
      </div>
      <div class="muted">Prices saved locally.</div>
    </div>
  </section>

  <!-- GALLERY -->
  <section id="tab-gallery" class="tabcontent hidden">
    <div class="panel">
      <h2>Gallery</h2>
      <input id="galleryUpload" type="file" multiple accept="image/*,video/*">
      <div id="galleryGrid" class="gallery-grid"></div>
      <div id="noGallery" class="muted" style="display:none;padding:10px;">No media yet.</div>
    </div>
  </section>

  <!-- MAP -->
  <section id="tab-map" class="tabcontent hidden">
    <div class="panel">
      <h2>Shop Map</h2>
      <div class="map-box">
        <p><strong>Location:</strong> Limassol, Cyprus</p>
        <p class="muted">Contact: +357 99 331469</p>
      </div>
    </div>
  </section>
</div>

<div class="modal" id="imgModal">
  <div class="modal-content">
    <img id="imgModalContent" class="modal-img">
    <div class="row" style="justify-content:flex-end;margin-top:10px">
      <button class="btn btn-secondary" id="closeImg">Close</button>
    </div>
  </div>
</div>

<div class="modal" id="adminModal">
  <div class="modal-content">
    <h2>Admin Login</h2>
    <input id="adminPass" type="password" placeholder="Password">
    <div class="row" style="justify-content:flex-end;margin-top:10px">
      <button class="btn btn-secondary" id="adminCancel">Cancel</button>
      <button class="btn" id="adminLogin">Login</button>
    </div>
    <div id="adminMsg" class="muted" style="margin-top:8px;"></div>
  </div>
</div>

<script>
(function(){
  const ADMIN_PASS='pro2024';
  let isAdmin=false;
  function get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
  function set(k,v){localStorage.setItem(k,JSON.stringify(v))}
  document.getElementById('adminBtn').onclick=()=>{document.getElementById('adminModal').classList.add('active');};
  document.getElementById('adminCancel').onclick=()=>{document.getElementById('adminModal').classList.remove('active');};
  document.getElementById('closeImg').onclick=()=>{document.getElementById('imgModal').classList.remove('active');};
  document.getElementById('adminLogin').onclick=()=>{
    const v=document.getElementById('adminPass').value;
    if(v===ADMIN_PASS){isAdmin=true;document.getElementById('adminMsg').textContent='Admin mode enabled';document.getElementById('adminModal').classList.remove('active');renderAll();}else{document.getElementById('adminMsg').textContent='Wrong password'}
  };
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.onclick=()=>{
      document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.tabcontent').forEach(s=>s.classList.add('hidden'));
      document.getElementById('tab-'+btn.dataset.tab).classList.remove('hidden');
    };
  });
  let strings=get('sp_strings',["Babolat RPM Blast","Luxilon Alu Power","Head Hawk"]);
  let overgrips=get('sp_over',["Tourna Grip","Yonex Super Grap"]);
  function renderStrings(){
    const cont=document.getElementById('stringsList');cont.innerHTML='';
    strings.forEach((s,i)=>{
      const div=document.createElement('div');div.className='item';
      div.innerHTML=`<div class="item-info">${s}</div>`+(isAdmin?`<button class="btn btn-danger btn-small" data-i="${i}" data-type="string">Delete</button>`:'');
      cont.appendChild(div);
    });
    const sel=document.getElementById('pString');sel.innerHTML='';strings.forEach(s=>{const o=document.createElement('option');o.textContent=s;sel.appendChild(o);});
  }
  function renderOver(){
    const cont=document.getElementById('overList');cont.innerHTML='';
    overgrips.forEach((s,i)=>{
      const div=document.createElement('div');div.className='item';
      div.innerHTML=`<div class="item-info">${s}</div>`+(isAdmin?`<button class="btn btn-danger btn-small" data-i="${i}" data-type="over">Delete</button>`:'');
      cont.appendChild(div);
    });
  }
  document.getElementById('addStringBtn').onclick=()=>{const v=document.getElementById('newString').value.trim();if(!v)return;strings.push(v);set('sp_strings',strings);document.getElementById('newString').value='';renderStrings();};
  document.getElementById('addOverBtn').onclick=()=>{const v=document.getElementById('newOver').value.trim();if(!v)return;overgrips.push(v);set('sp_over',overgrips);document.getElementById('newOver').value='';renderOver();};
  document.addEventListener('click',e=>{
    if(e.target.dataset.type==='string'){strings.splice(e.target.dataset.i,1);set('sp_strings',strings);renderStrings();}
    if(e.target.dataset.type==='over'){overgrips.splice(e.target.dataset.i,1);set('sp_over',overgrips);renderOver();}
    if(e.target.dataset.deljob){jobs.splice(e.target.dataset.deljob,1);set('sp_jobs',jobs);renderJobs();}
    if(e.target.dataset.delgallery){gallery.splice(e.target.dataset.delgallery,1);set('sp_gallery',gallery);renderGallery();}
  });
  renderStrings();renderOver();
  let gallery=get('sp_gallery',[]);
  function renderGallery(){
    const grid=document.getElementById('galleryGrid');const no=document.getElementById('noGallery');grid.innerHTML='';
    if(gallery.length===0){no.style.display='block';return;}no.style.display='none';
    gallery.forEach((m,i)=>{
      const div=document.createElement('div');div.className='gallery-item';
      const media=m.type.startsWith('video')?`<video src="${m.data}" controls></video>`:`<img src="${m.data}" onclick="showImg(this.src)">`;
      div.innerHTML=media+(isAdmin?`<button class="btn btn-danger btn-small del" data-delgallery="${i}">Delete</button>`:'');
      grid.appendChild(div);
    });
  }
  document.getElementById('galleryUpload').addEventListener('change',async(e)=>{
    const files=Array.from(e.target.files);for(const f of files){const data=await readAsDataURL(f);gallery.push({id:Date.now()+'_'+Math.random(),data,name:f.name,type:f.type});}
    set('sp_gallery',gallery);renderGallery();e.target.value='';
  });
  renderGallery();
  function readAsDataURL(file){return new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file);});}
  window.showImg=(src)=>{document.getElementById('imgModalContent').src=src;document.getElementById('imgModal').classList.add('active');};
  let jobs=get('sp_jobs',[]);
  const dateNow=new Date().toISOString().split('T')[0];document.getElementById('pDate').value=dateNow;
  document.getElementById('clearJobBtn').onclick=()=>{['pName','pPhone','pRacket','pTension','pNotes','pPrice'].forEach(id=>document.getElementById(id).value='');document.getElementById('pPattern').value='Prima';document.getElementById('pPaid').value='Due';document.getElementById('pPhotos').value='';document.getElementById('pDate').value=dateNow;};
  document.getElementById('addJobBtn').onclick=async()=>{const job={id:Date.now(),name:document.getElementById('pName').value.trim(),phone:document.getElementById('pPhone').value.trim(),racket:document.getElementById('pRacket').value.trim(),string:document.getElementById('pString').value,tension:document.getElementById('pTension').value.trim(),pattern:document.getElementById('pPattern').value,date:document.getElementById('pDate').value,price:document.getElementById('pPrice').value.trim(),paid:document.getElementById('pPaid').value,notes:document.getElementById('pNotes').value.trim(),photos:[]};if(!job.name){alert('Client name required');return;}const files=Array.from(document.getElementById('pPhotos').files);for(const f of files){job.photos.push(await readAsDataURL(f));}jobs.unshift(job);set('sp_jobs',jobs);document.getElementById('clearJobBtn').click();renderJobs();};
  function renderJobs(){const container=document.getElementById('jobsList');const no=document.getElementById('noJobs');const q=document.getElementById('searchJobs').value.toLowerCase();const filtered=jobs.filter(j=>!q||(j.name+j.phone+j.racket+j.string+j.notes).toLowerCase().includes(q));container.innerHTML='';if(filtered.length===0){no.style.display='block';return;}no.style.display='none';filtered.forEach((j,idx)=>{const i=jobs.indexOf(j);const div=document.createElement('div');div.className='job-card';const photosHtml=j.photos.map(p=>`<div class="thumb"><img src="${p}" onclick="showImg(this.src)"></div>`).join('');div.innerHTML=`<div class="job-header"><div><div style="font-weight:700">${j.name} <span class="muted">• ${j.phone}</span></div><div class="muted">${j.date} • ${j.racket}</div></div><div style="text-align:right"><div style="font-weight:700;color:var(--accent)">€${j.price||'-'}</div><span class="badge ${j.paid==='Paid'?'badge-paid':'badge-due'}">${j.paid}</span>${isAdmin?`<button class="btn btn-danger btn-small" data-deljob="${i}" style="margin-top:6px">Delete</button>`:''}</div></div><div class="row" style="font-size:13px"><div class="tag">String: ${j.string||'-'}</div><div class="tag">Tension: ${j.tension||'-'}</div><div class="tag">Pattern: ${j.pattern||'-'}</div></div>${j.notes?`<div class="muted" style="margin-top:6px">${j.notes}</div>`:''}${photosHtml?`<div class="thumbs">${photosHtml}</div>`:''}`;container.appendChild(div);});}
  document.getElementById('searchJobs').addEventListener('input',renderJobs);renderJobs();
  function renderAll(){renderStrings();renderOver();renderGallery();renderJobs();}
  renderAll();
})();
</script>
</body>
</html>
