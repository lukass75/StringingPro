<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRO TENNIS STRINGING LIMASSOL - ULTRA PRO V3</title>
<style>
:root{
  --bg:#0c1116;--panel:#151b22;--panel2:#1d252f;--accent:#ffb63d;--accent2:#2fb6ff;--accent3:#38d39f;--text:#e6eef5;--muted:#8fa1b2;--danger:#ff5b5b;
  --border:#283240;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.4}
header{background:linear-gradient(135deg,#101820 0%,#1d252f 100%);border-bottom:2px solid var(--accent);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
header h1{font-size:18px;font-weight:700;letter-spacing:0.5px;color:var(--accent)}
.header-stats{display:flex;gap:16px;font-size:12px;flex-wrap:wrap}
.stat{background:var(--panel2);padding:6px 10px;border-radius:6px;border:1px solid var(--border);color:var(--text)}
.stat strong{color:var(--accent2)}
.login-wrap{display:flex;gap:8px;align-items:center}
.login-wrap input{padding:6px 8px;border-radius:5px;border:1px solid var(--border);background:#0f1419;color:var(--text);font-size:12px;width:160px}
.login-wrap button{padding:6px 12px;background:var(--accent);border:none;border-radius:5px;color:#111;font-weight:600;cursor:pointer;font-size:12px}
.login-wrap button:hover{background:#ffc966}
nav{display:flex;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:12px 18px;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:#0f1419}
.tab .badge{font-size:10px;background:var(--accent2);color:#001; padding:2px 5px;border-radius:10px;margin-left:5px;font-weight:700}
.container{padding:18px;max-width:1300px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px}
h2{font-size:15px;color:var(--accent);margin-bottom:12px;font-weight:600}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;font-weight:500}
input,select,textarea{width:100%;padding:8px 9px;background:#0f1419;border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:13px}
textarea{resize:vertical;min-height:60px}
button.primary{background:var(--accent);color:#111;border:none;padding:9px 14px;border-radius:5px;font-weight:600;cursor:pointer;font-size:13px}
button.primary:hover{background:#ffc966}
button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:7px 11px;border-radius:5px;font-weight:500;cursor:pointer;font-size:12px}
button.secondary:hover{background:#263140}
button.danger{background:var(--danger);color:#fff;border:none;padding:6px 10px;border-radius:5px;font-size:12px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:12px}
table th,table td{border:1px solid var(--border);padding:6px 8px;text-align:left}
table th{background:var(--panel2);color:var(--accent2);font-weight:600}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gallery-item{background:#0f1419;border:1px solid var(--border);border-radius:6px;overflow:hidden;position:relative}
.gallery-item img,.gallery-item video{width:100%;height:140px;object-fit:cover;display:block}
.gallery-item .del{position:absolute;top:6px;right:6px;background:var(--danger);border:none;color:#fff;border-radius:4px;padding:2px 6px;font-size:11px;cursor:pointer}
.badge-sm{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--accent3);color:#001;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap}
.hidden{display:none}
.chart-wrap{background:#0f1419;border:1px solid var(--border);border-radius:6px;padding:10px;margin-top:8px}
canvas{width:100%;height:120px;background:#0b1014;border-radius:4px;border:1px solid var(--border)}
.player-card{background:#0f1419;border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:10px}
.player-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.player-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.pill{background:var(--panel2);padding:3px 7px;border-radius:12px;border:1px solid var(--border)}
.right{float:right}
hr{border:none;border-top:1px solid var(--border);margin:12px 0}
small{color:var(--muted);font-size:11px}
</style>
</head>
<body>
<header>
  <h1>PRO TENNIS STRINGING LIMASSOL</h1>
  <div class="header-stats">
    <div class="stat">â¡ <strong>24h Service</strong></div>
    <div class="stat">ð¾ <strong>1000+ rackets</strong></div>
    <div class="stat">ð <strong>Wilson Baiardo</strong></div>
  </div>
  <div class="login-wrap" id="loginWrap">
    <input type="password" id="adminPass" placeholder="Admin password">
    <button id="loginBtn">Admin Login</button>
    <span id="loginState" class="badge-sm hidden">Admin</span>
  </div>
</header>
<nav id="tabs"></nav>
<div class="container" id="content"></div>
<script>
const ADMIN_PASS="P1l2s3t4";
let isAdmin=false;
const STORAGE_JOBS='sp_jobs_v3';
const STORAGE_GAL='sp_gallery_v3';
const STORAGE_PRICES='sp_prices_v3';
const STORAGE_INV='sp_inv_v3';
let prices = JSON.parse(localStorage.getItem(STORAGE_PRICES) || '{"basic":15,"premium":25,"overgrip":5}');
let inventory = JSON.parse(localStorage.getItem(STORAGE_INV) || '{"strings":"Yonex Poly Tour 120 (10)\nLuxilon ALU Power 125 (7)\nBabolat RPM Blast 130 (5)\nWilson Sensation 125 (12)\nToalson Polylon 125 (6)","overgrips":"Wilson Pro Overgrip (20)\nBabolat VS Overgrip (15)"}');
const tabs=[
 {id:'clients',label:'Clients & Jobs'},
 {id:'profiles',label:'Player Profiles',badge:'NEW'},
 {id:'inventory',label:'Inventory'},
 {id:'prices',label:'Prices'},
 {id:'gallery',label:'Gallery'},
 {id:'tech',label:'Tech Guide'},
 {id:'location',label:'Location'}
];
let activeTab='clients';

function saveJobs(j){localStorage.setItem(STORAGE_JOBS,JSON.stringify(j));}
function getJobs(){return JSON.parse(localStorage.getItem(STORAGE_JOBS) || '[]');}
function saveGallery(g){localStorage.setItem(STORAGE_GAL,JSON.stringify(g));}
function getGallery(){return JSON.parse(localStorage.getItem(STORAGE_GAL) || '[]');}
function savePrices(){localStorage.setItem(STORAGE_PRICES,JSON.stringify(prices));}
function saveInv(){localStorage.setItem(STORAGE_INV,JSON.stringify(inventory));}

function renderTabs(){
  const nav=document.getElementById('tabs');nav.innerHTML='';
  tabs.forEach(t=>{
    const d=document.createElement('div');d.className='tab'+(t.id===activeTab?' active':'');
    d.innerHTML=t.label+(t.badge?` <span class="badge">${t.badge}</span>`:'');
    d.onclick=()=>{activeTab=t.id;renderTabs();renderContent();};
    nav.appendChild(d);
  });
}

function renderContent(){
  const c=document.getElementById('content');c.innerHTML='';
  if(activeTab==='clients') renderClients(c);
  else if(activeTab==='profiles') renderProfiles(c);
  else if(activeTab==='inventory') renderInventory(c);
  else if(activeTab==='prices') renderPrices(c);
  else if(activeTab==='gallery') renderGallery(c);
  else if(activeTab==='tech') renderTech(c);
  else if(activeTab==='location') renderLocation(c);
}

function renderClients(c){
  const section=document.createElement('div');section.className='panel';
  section.innerHTML='<h2>New / Add Client Job</h2><div id="clientForm" class="grid grid-2"></div><hr><h2>Jobs Log</h2><div id="jobsTable"></div>';
  c.appendChild(section);
  const form=document.getElementById('clientForm');
  form.innerHTML=`
    <div><label>Name</label><input id="f_name" placeholder="e.g. John Doe"></div>
    <div><label>Phone</label><input id="f_phone" placeholder="+357 ..."></div>
    <div><label>Racket</label><input id="f_racket" placeholder="Babolat Pure Drive 100"></div>
    <div><label>String</label><select id="f_string"><option>Yonex</option><option>Luxilon</option><option>Babolat</option><option>Wilson</option><option>Toalson</option></select></div>
    <div><label>Tension Summer (kg/lbs)</label><input id="f_sum" placeholder="24 / 53"></div>
    <div><label>Tension Winter (kg/lbs)</label><input id="f_win" placeholder="25 / 55"></div>
    <div><label>Pattern</label><select id="f_pattern"><option>Prima</option><option>Seconda</option></select></div>
    <div><label>Date</label><input id="f_date" type="date"></div>
    <div><label>Price (â¬)</label><input id="f_price" type="number" step="0.5" placeholder="25"></div>
    <div><label>Paid</label><select id="f_paid"><option value="Yes">Yes</option><option value="No">No</option></select></div>
    <div style="grid-column:1/-1"><label>Racket Photos (multiple)</label><input id="f_photos" type="file" multiple accept="image/*"></div>
    <div style="grid-column:1/-1"><label>Notes</label><textarea id="f_notes" placeholder="Notes..."></textarea></div>
    <div style="grid-column:1/-1"><button class="primary" id="btnAdd">+ Add Job</button></div>
  `;
  document.getElementById('btnAdd').onclick=addJob;
  document.getElementById('f_date').value=new Date().toISOString().split('T')[0];
  renderJobsTable();
}

function addJob(){
  const files=document.getElementById('f_photos').files;
  const job={
    id:Date.now(),name:$('#f_name').value.trim(),phone:$('#f_phone').value.trim(),racket:$('#f_racket').value.trim(),
    string:$('#f_string').value,summer:$('#f_sum').value.trim(),winter:$('#f_win').value.trim(),
    pattern:$('#f_pattern').value,date:$('#f_date').value,price:$('#f_price').value,paid:$('#f_paid').value,notes:$('#f_notes').value.trim(),photos:[]
  };
  if(!job.name){alert('Name required');return;}
  if(files.length>0){
    let loaded=0;const total=files.length;
    for(let i=0;i<files.length;i++){
      const r=new FileReader();
      r.onload=e=>{job.photos.push(e.target.result);loaded++; if(loaded===total){saveAndDone(job);}};
      r.readAsDataURL(files[i]);
    }
  }else{saveAndDone(job);}
}

function saveAndDone(job){
  const jobs=getJobs();jobs.unshift(job);saveJobs(jobs);
  document.getElementById('clientForm').querySelectorAll('input,textarea').forEach(i=>{if(i.type!='file')i.value='';});
  document.getElementById('f_photos').value='';
  renderJobsTable();alert('Job added!');
}

function renderJobsTable(){
  const jobs=getJobs();const div=document.getElementById('jobsTable');
  if(jobs.length===0){div.innerHTML='<small>No jobs yet.</small>';return;}
  let html='<table><tr><th>Date</th><th>Player</th><th>Racket</th><th>String</th><th>Sum/Winter</th><th>Pattern</th><th>Price</th><th>Paid</th><th>Photos</th><th></th></tr>';
  jobs.forEach(j=>{
    html+='<tr><td>'+j.date+'</td><td>'+escapeHtml(j.name)+'</td><td>'+escapeHtml(j.racket)+'</td><td>'+j.string+'</td><td>'+escapeHtml(j.summer)+' / '+escapeHtml(j.winter)+'</td><td>'+j.pattern+'</td><td>'+j.price+'â¬</td><td>'+j.paid+'</td><td>'+(j.photos?j.photos.length:'0')+'</td><td>'+(isAdmin?'<button class="danger" onclick="deleteJob('+j.id+')">Del</button>':'-')+'</td></tr>';
  });
  html+='</table>';div.innerHTML=html;
}
window.deleteJob=function(id){if(!isAdmin)return;let jobs=getJobs().filter(x=>x.id!==id);saveJobs(jobs);renderJobsTable();}

function renderProfiles(c){
  const jobs=getJobs();const panel=document.createElement('div');panel.className='panel';panel.innerHTML='<h2>Player Profiles</h2><div id="profilesList"></div>';c.appendChild(panel);
  const groups={};jobs.forEach(j=>{if(!groups[j.name])groups[j.name]=[];groups[j.name].push(j);});
  const list=document.getElementById('profilesList');list.innerHTML='';
  const names=Object.keys(groups).sort();if(names.length===0){list.innerHTML='<small>No players yet.</small>';return;}
  names.forEach(name=>{
    const arr=groups[name].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,20);
    const total=arr.length;
    const strings={};let sumSum=0,sumCount=0,sumWin=0,winCount=0;const photos=[];
    arr.forEach(j=>{strings[j.string]=(strings[j.string]||0)+1;const s=parseFloat(j.summer);if(!isNaN(s)){sumSum+=s;sumCount++;}const w=parseFloat(j.winter);if(!isNaN(w)){sumWin+=w;winCount++;}if(j.photos){photos.push(...j.photos);}});
    const fav=Object.entries(strings).sort((a,b)=>b[1]-a[1])[0]?.[0]||'-';
    const avgS=sumCount? (sumSum/sumCount).toFixed(1):'-';const avgW=winCount? (sumWin/winCount).toFixed(1):'-';
    const last6=arr.slice(0,6).reverse();
    const card=document.createElement('div');card.className='player-card';
    card.innerHTML='<div class="player-header"><strong>'+escapeHtml(name)+'</strong><div class="player-meta"><span class="pill">Jobs: '+total+'</span><span class="pill">Fav String: '+fav+'</span><span class="pill">Avg Summer: '+avgS+'</span><span class="pill">Avg Winter: '+avgW+'</span></div></div>';
    const canvas=document.createElement('canvas');canvas.width=600;canvas.height=120;card.appendChild(canvas);
    const chartWrap=document.createElement('div');chartWrap.className='chart-wrap';chartWrap.appendChild(canvas);card.appendChild(chartWrap);
    let tabhtml='<table><tr><th>Date</th><th>Fir</th><th>Tensiune Vara</th><th>Tensiune Iarna</th><th>String</th><th>Pattern</th><th>Price</th></tr>';
    arr.slice(0,10).forEach(j=>{tabhtml+='<tr><td>'+j.date+'</td><td>'+escapeHtml(j.racket)+'</td><td>'+escapeHtml(j.summer)+'</td><td>'+escapeHtml(j.winter)+'</td><td>'+j.string+'</td><td>'+j.pattern+'</td><td>'+j.price+'â¬</td></tr>';});
    tabhtml+='</table>';card.innerHTML+=tabhtml;
    if(photos.length){const pdiv=document.createElement('div');pdiv.style='display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;';photos.slice(0,6).forEach(p=>{const im=document.createElement('img');im.src=p;im.style='width:60px;height:60px;object-fit:cover;border-radius:4px;border:1px solid var(--border)';pdiv.appendChild(im);});card.appendChild(pdiv);}
    list.appendChild(card);drawChart(canvas,last6);
  });
}

function drawChart(canvas,items){
  const ctx=canvas.getContext('2d');const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);ctx.strokeStyle='#283240';ctx.strokeRect(0,0,W,H);
  if(items.length===0){ctx.fillStyle='#8fa1b2';ctx.font='12px sans-serif';ctx.fillText('No data',10,20);return;}
  const pad=30,barW=(W-2*pad)/items.length/2.5;let max=0;
  items.forEach(i=>{max=Math.max(max,parseFloat(i.summer)||0,parseFloat(i.winter)||0);});max=Math.max(max,30);
  items.forEach((it,idx)=>{
    const x=pad+idx*((W-2*pad)/items.length);const s=parseFloat(it.summer)||0;const w=parseFloat(it.winter)||0;
    const hS=(s/max)*(H-pad-25);const hW=(w/max)*(H-pad-25);
    ctx.fillStyle='#ffb63d';ctx.fillRect(x,H-pad-hS,barW,hS);
    ctx.fillStyle='#2fb6ff';ctx.fillRect(x+barW+4,H-pad-hW,barW,hW);
    ctx.fillStyle='#8fa1b2';ctx.font='10px sans-serif';ctx.fillText(it.date.slice(5),x,H-pad+12);
  });
  ctx.fillStyle='#ffb63d';ctx.fillRect(10,6,10,8);ctx.fillStyle='#e6eef5';ctx.fillText('Summer',24,13);
  ctx.fillStyle='#2fb6ff';ctx.fillRect(90,6,10,8);ctx.fillStyle='#e6eef5';ctx.fillText('Winter',104,13);
}

function renderInventory(c){
  const p=document.createElement('div');p.className='panel';p.innerHTML='<h2>Inventory</h2><div class="grid grid-2"></div>';c.appendChild(p);
  const wrap=p.querySelector('.grid');
  wrap.innerHTML='<div><label>Strings (one per line)</label><textarea id="inv_strings" rows="6"></textarea></div><div><label>Overgrips (one per line)</label><textarea id="inv_over" rows="6"></textarea></div><div style="grid-column:1/-1"><button class="primary" id="saveInv">Save Inventory</button></div>';
  $('#inv_strings').value=inventory.strings;$('#inv_over').value=inventory.overgrips;
  $('#saveInv').onclick=()=>{if(!isAdmin){alert('Admin only');return;}inventory.strings=$('#inv_strings').value;inventory.overgrips=$('#inv_over').value;saveInv();alert('Saved!');};
}

function renderPrices(c){
  const p=document.createElement('div');p.className='panel';p.innerHTML='<h2>Prices (â¬)</h2><div class="grid grid-3" id="priceGrid"></div>';c.appendChild(p);
  const grid=document.getElementById('priceGrid');
  grid.innerHTML='<div><label>Basic Stringing</label><input type="number" id="p_basic" step="0.5"></div><div><label>Premium Stringing</label><input type="number" id="p_prem" step="0.5"></div><div><label>Overgrip</label><input type="number" id="p_over" step="0.5"></div><div style="grid-column:1/-1"><button class="primary" id="saveP">Save Prices</button><small> Prices are 15, 25, 5 by default.</small></div>';
  $('#p_basic').value=prices.basic;$('#p_prem').value=prices.premium;$('#p_over').value=prices.overgrip;
  $('#saveP').onclick=()=>{if(!isAdmin){alert('Admin only');return;}prices.basic=parseFloat($('#p_basic').value)||0;prices.premium=parseFloat($('#p_prem').value)||0;prices.overgrip=parseFloat($('#p_over').value)||0;savePrices();alert('Prices saved!');};
}

function renderGallery(c){
  const p=document.createElement('div');p.className='panel';p.innerHTML='<h2>Gallery</h2><div><label>Upload Photos/Videos (multiple)</label><input type="file" id="g_upload" multiple accept="image/*,video/*"></div><hr><div class="gallery-grid" id="galGrid"></div>';c.appendChild(p);
  document.getElementById('g_upload').onchange=(e)=>{const files=e.target.files;if(files.length===0)return;let gall=getGallery();let loaded=0;for(let i=0;i<files.length;i++){const r=new FileReader();r.onload=ev=>{gall.push({id:Date.now()+i,data:ev.target.result,type:files[i].type});loaded++;if(loaded===files.length){saveGallery(gall);renderGalleryGrid();}};r.readAsDataURL(files[i]);}};
  renderGalleryGrid();
}
function renderGalleryGrid(){
  const gall=getGallery();const g=document.getElementById('galGrid');g.innerHTML='';
  if(gall.length===0){g.innerHTML='<small>No media yet.</small>';return;}
  gall.slice().reverse().forEach(it=>{const div=document.createElement('div');div.className='gallery-item';if(it.type.startsWith('video')){div.innerHTML='<video src="'+it.data+'" controls></video>'+(isAdmin?'<button class="del" onclick="delGal('+it.id+')">X</button>':'');}else{div.innerHTML='<img src="'+it.data+'">'+(isAdmin?'<button class="del" onclick="delGal('+it.id+')">X</button>':'');}g.appendChild(div);});
}
window.delGal=function(id){if(!isAdmin)return;let gall=getGallery().filter(x=>x.id!==id);saveGallery(gall);renderGalleryGrid();};

function renderTech(c){
  const p=document.createElement('div');p.className='panel';p.innerHTML='<h2>Tech Guide</h2><ul style="padding-left:18px;font-size:13px;color:var(--muted)"><li>Always check grommets before stringing.</li><li>Summer: lower tension for comfort & power (~23-24kg).</li><li>Winter: increase +1-2kg for control (~25-26kg).</li><li>Prima pattern: main first, standard for most racquets.</li><li>Seconda: cross first, for softer feel.</li><li>Clean machine clamps monthly. Keep tension calibrator on hand.</li></ul>';c.appendChild(p);
}

function renderLocation(c){
  const p=document.createElement('div');p.className='panel';p.innerHTML='<h2>Location</h2><p style="font-size:13px;margin-bottom:8px;">Address: <strong>Thirotou Georgiou 15, Limassol</strong></p><p style="font-size:12px;color:var(--muted)">Coordinates: 34.669398, 33.02486 Â· Place ID: 893555869962192</p><p style="margin:10px 0;"><a href="https://www.google.com/maps/search/?api=1&query=34.669398,33.02486" target="_blank" style="color:var(--accent2);text-decoration:none">ð Open in Google Maps</a></p><div style="background:#0f1419;border:1px solid var(--border);border-radius:6px;padding:10px;margin-top:8px;"><iframe width="100%" height="250" style="border:0;border-radius:6px" loading="lazy" src="https://www.google.com/maps?q=34.669398,33.02486&z=15&output=embed"></iframe></div>';c.appendChild(p);
}

document.getElementById('loginBtn').onclick=()=>{const pass=$('#adminPass').value;if(pass===ADMIN_PASS){isAdmin=true;$('#loginState').classList.remove('hidden');$('#loginBtn').style.display='none';$('#adminPass').style.display='none';alert('Admin logged in!');renderContent();}else{alert('Wrong password');}};
function $(sel){return document.querySelector(sel);}function escapeHtml(s){return (s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');}
renderTabs();renderContent();
</script>
</body>
</html>
